appId: com.hermeswebui.studio
productName: Studio
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

publish: null

# Don't auto-prune our root node_modules; we curate `files` and `extraResources` ourselves.
buildDependenciesFromSource: false
nodeGypRebuild: false
npmRebuild: false
afterPack: "./scripts/verify-packaged-webui.mjs"

files:
  - "dist/**/*"
  - "package.json"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme,LICENSE,LICENSE.txt,license,*.d.ts}"
  - "!**/node_modules/.bin"
  - "!**/{.DS_Store,.git,.gitignore,.eslintrc*,.prettierrc*,*.map,tsconfig.json}"

# Web UI and the prebuilt offline runtime live outside the asar. The app
# extracts its local runtime archive on first launch without downloading it.
# This package lives at packages/desktop, so ../.. is the hermes-web-ui repo root.
extraResources:
  - from: "resources/runtime"
    to: "runtime"
    filter:
      - "hermes-runtime-win-${arch}.json"
      - "hermes-runtime-hermes-agent-*-win-${arch}.tar.gz"
      - "hermes-runtime-hermes-agent-*-win-${arch}.tar.gz.sha256"
  - from: "build"
    to: "build"
    filter:
      - "icon.png"
      - "icon.ico"
      - "trayWindows.png"
      - "runtime-release.json"
  - from: "../.."
    to: "webui"
    filter:
      - "package.json"
      - "bin/**"
      - "dist/**"
      - "!packages/desktop/**"
      # Exclude repository-root development files without dropping nested
      # runtime assets such as dist/ekko-skills/*/scripts/**.
      - "!.git/**"
      - "!.github/**"
      - "!docs/**"
      - "!tests/**"
      - "!scripts/**"
      - "!playwright.config.ts"
      - "!README*"
      - "!**/*.map"
  # electron-builder 26 deliberately skips a root-level node_modules directory
  # when it is nested inside a broader matcher. Use node_modules itself as the
  # source so the pruned production dependencies are copied into the Web UI.
  - from: "../../node_modules"
    to: "webui/node_modules"
    filter:
      - "**/*"
      # Drop other-platform node-pty prebuilds (saves ~45MB)
      - "!node-pty/prebuilds/!(${platform}-${arch})/**"
      # Linux has no bundled prebuild and loads the native module compiled by
      # `npm rebuild node-pty` from build/Release.
      - "!node-pty/build/**"
      - "node-pty/build/Release/pty.node"
      - "!**/*.md"

asarUnpack:
  - "**/*.node"

win:
  executableName: Ekko Studio
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: "Ekko.Studio-${version}-${arch}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  include: build/installer.nsh
