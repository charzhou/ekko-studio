name: AFY Studio Windows Build

on:
  push:
    branches: [oem]
  workflow_dispatch:
    inputs:
      target_arch:
        description: Windows architecture
        required: true
        type: choice
        default: x64
        options: [x64, arm64]

permissions:
  contents: read

concurrency:
  group: afy-windows-${{ inputs.target_arch || 'x64' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Windows ${{ inputs.target_arch || 'x64' }}
    runs-on: ${{ inputs.target_arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/desktop/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild node-pty
      - name: Check OEM and architecture contracts
        run: npm run harness:check
      - name: Build web application and local server
        run: npm run build
      - name: Stage production dependencies
        run: npm prune --omit=dev --no-audit --no-fund
      - name: Verify image runtime
        run: npm run verify:sharp-runtime
      - name: Build Windows ARM64 speech binding
        if: inputs.target_arch == 'arm64'
        run: node packages/desktop/scripts/build-windows-arm64-speech.mjs
      - name: Install desktop dependencies
        run: npm ci --prefix packages/desktop --no-audit --no-fund
      - name: Build Windows installer
        run: npm --prefix packages/desktop run dist -- --win nsis --${{ inputs.target_arch || 'x64' }} --publish never
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: afy-studio-windows-${{ inputs.target_arch || 'x64' }}
          path: packages/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 7
