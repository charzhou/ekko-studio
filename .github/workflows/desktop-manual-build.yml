name: Studio Windows Build

on:
  push:
    branches: [oem]
  workflow_dispatch:
    inputs:
      target_arch:
        description: Windows architecture
        required: true
        type: choice
        default: x64
        options: [x64]

permissions:
  contents: read

concurrency:
  group: studio-windows-${{ inputs.target_arch || 'x64' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Windows x64
    needs: runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/desktop/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild node-pty
      - name: Check OEM and architecture contracts
        run: npm run harness:check
      - name: Build web application and local server
        run: npm run build
      - name: Stage production dependencies
        run: npm prune --omit=dev --no-audit --no-fund
      - name: Verify image runtime
        run: npm run verify:sharp-runtime
      - name: Install desktop dependencies
        run: npm ci --prefix packages/desktop --no-audit --no-fund
      - name: Download bundled offline runtime
        uses: actions/download-artifact@v4
        with:
          name: studio-runtime-windows-x64
          path: packages/desktop/resources/runtime
      - name: Verify runtime artifact and stage its release identity
        run: node packages/desktop/scripts/stage-bundled-runtime.mjs
      - name: Build Windows installer
        run: npm --prefix packages/desktop run dist -- --win nsis --x64 --publish never
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: studio-windows-x64
          path: packages/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 7

  runtime:
    # Hermes 0.22.0 lacks core Windows ARM64 wheels. Distribute complete x64
    # installers until an equivalent ARM64 runtime can be prepared.
    name: Windows runtime x64
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TARGET_OS: win32
      TARGET_ARCH: x64
      # Match the Hermes release currently used by the local Studio integration.
      # Keep version, release ref and peeled commit together when upgrading.
      HERMES_VERSION: 0.22.0
      HERMES_SOURCE_REPOSITORY: https://github.com/NousResearch/hermes-agent.git
      HERMES_SOURCE_REF: v0.22.0
      HERMES_SOURCE_COMMIT: e06df9c2eae6901f4c88f464e0ae6e753c0428b8
      PBS_PY: 3.14.7
      PBS_TAG: '20260901'
      HERMES_DESKTOP_NODE_VERSION: 22.22.0
      GIT_FOR_WINDOWS_URL: https://github.com/git-for-windows/git/releases/download/v2.56.0.windows.2/MinGit-2.56.0.2-64-bit.zip
      # Core desktop tools and Anthropic support; optional messaging adapters,
      # browser binaries and upstream frontends are outside this runtime.
      HERMES_EXTRAS: all,anthropic
      HERMES_SKIP_BROWSER_RUNTIME: '1'
      HERMES_SKIP_FRONTEND_BUILD: '1'
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/desktop/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Install runtime build dependencies
        run: npm ci --prefix packages/desktop --ignore-scripts --no-audit --no-fund
      - name: Prepare pinned Windows runtime
        run: npm --prefix packages/desktop run prepare:runtime
      - name: Validate relocation and package runtime
        run: npm --prefix packages/desktop run package:runtime
      - name: Upload offline runtime
        uses: actions/upload-artifact@v4
        with:
          name: studio-runtime-windows-x64
          path: |
            packages/desktop/release/runtime/*.tar.gz
            packages/desktop/release/runtime/*.tar.gz.sha256
            packages/desktop/release/runtime/*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
